[package]
name = "denon-avr-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lib]
path = "src/lib.rs"
[dependencies]
denon-avr-application = { path = "../application" }
denon-avr-domain = { path = "../domain" }
denon-avr-policy = { path = "../policy" }
denon-avr-protocol = { path = "../protocol" }
getrandom = "0.3"
if-addrs = "0.15"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
